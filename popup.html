<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Pulse Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <h1>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        Privacy Pulse
      </h1>
      <p>Consent Guardian</p>
    </div>

    <div class="popup-body">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>

      <div id="content" style="display: none;">
        <div class="toggle-container">
          <span class="toggle-label">Protection Enabled</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleEnabled" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div id="currentSite" class="current-site">
          <h4>Current Site</h4>
          <div class="domain" id="siteDomain">Loading...</div>
          <div class="banner-status" id="bannerStatus">Scanning...</div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="statIntercepted">0</div>
            <div class="stat-label">Banners Blocked</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statRejected">0</div>
            <div class="stat-label">Rejected</div>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="btnViewSiteData">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            View On-Device Data
          </button>
          
          <button class="btn btn-secondary" id="btnClearPreference">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Clear Site Preference
          </button>
          
          <button class="btn btn-danger" id="btnClearAllPreferences">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Reset All Data
          </button>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-links">
        <a href="#" class="footer-link" id="linkHelp">Help</a>
        <a href="#" class="footer-link" id="linkAbout">About</a>
      </div>
      <div class="footer-version">v1.1.0</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
